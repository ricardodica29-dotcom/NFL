<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Betting Analytics 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    .card-blur { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="gradient-bg text-gray-100 min-h-screen pb-10">
  <header class="border-b border-gray-800 bg-slate-900/80 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-blue-600 rounded-lg"><i data-lucide="trophy" class="w-6 h-6 text-white"></i></div>
        <div>
          <h1 class="font-bold text-lg leading-none">NFL Betting Analytics</h1>
          <p class="text-xs text-gray-400 mt-1">Modelo Poisson & Eficiencia 32 Equipos</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 mt-6">
    <div class="bg-slate-800/60 p-4 rounded-xl border border-gray-700/50 mb-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-lg flex items-center gap-2"><i data-lucide="list" class="w-5 h-5 text-blue-400"></i> Tabla General de Equipos (32/32)</h2>
        <input type="text" id="searchInput" onkeyup="filterTeams()" placeholder="Buscar equipo..." class="bg-slate-900 border border-gray-700 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500">
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm" id="teamsTable">
          <thead class="bg-slate-900/80 text-gray-400 text-xs uppercase">
            <tr>
              <th class="p-3">Equipo</th>
              <th class="p-3 text-center">JJ</th>
              <th class="p-3 text-center">Y. Tierra</th>
              <th class="p-3 text-center">Y. Pase</th>
              <th class="p-3 text-center">PPG</th>
              <th class="p-3 text-center">PAG</th>
            </tr>
          </thead>
          <tbody id="teamsBody" class="divide-y divide-gray-700/50">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const nflTeams = [
      { name: "Arizona Cardinals", code: "ARI", jj: 17, yt: 2150, yp: 3600, ppg: 21.2, pag: 24.5 },
      { name: "Atlanta Falcons", code: "ATL", jj: 17, yt: 2020, yp: 3850, ppg: 22.8, pag: 21.9 },
      { name: "Baltimore Ravens", code: "BAL", jj: 17, yt: 2650, yp: 3700, ppg: 28.4, pag: 16.5 },
      { name: "Buffalo Bills", code: "BUF", jj: 17, yt: 2210, yp: 4100, ppg: 26.5, pag: 18.3 },
      { name: "Carolina Panthers", code: "CAR", jj: 17, yt: 1780, yp: 3100, ppg: 15.6, pag: 26.8 },
      { name: "Chicago Bears", code: "CHI", jj: 17, yt: 2300, yp: 3250, ppg: 21.0, pag: 22.3 },
      { name: "Cincinnati Bengals", code: "CIN", jj: 17, yt: 1850, yp: 4200, ppg: 24.1, pag: 23.0 },
      { name: "Cleveland Browns", code: "CLE", jj: 17, yt: 2100, yp: 3400, ppg: 21.5, pag: 20.1 },
      { name: "Dallas Cowboys", code: "DAL", jj: 17, yt: 1950, yp: 4350, ppg: 27.9, pag: 20.2 },
      { name: "Denver Broncos", code: "DEN", jj: 17, yt: 1820, yp: 3300, ppg: 20.8, pag: 23.4 },
      { name: "Detroit Lions", code: "DET", jj: 17, yt: 2350, yp: 4400, ppg: 27.1, pag: 23.2 },
      { name: "Green Bay Packers", code: "GB", jj: 17, yt: 2180, yp: 3900, ppg: 23.8, pag: 20.6 },
      { name: "Houston Texans", code: "HOU", jj: 17, yt: 1790, yp: 4150, ppg: 22.2, pag: 20.8 },
      { name: "Indianapolis Colts", code: "IND", jj: 17, yt: 2200, yp: 3650, ppg: 23.3, pag: 24.1 },
      { name: "Jacksonville Jaguars", code: "JAX", jj: 17, yt: 1830, yp: 3800, ppg: 22.2, pag: 21.8 },
      { name: "Kansas City Chiefs", code: "KC", jj: 17, yt: 1860, yp: 4250, ppg: 24.6, pag: 17.3 },
      { name: "Las Vegas Raiders", code: "LV", jj: 17, yt: 1600, yp: 3500, ppg: 19.5, pag: 24.1 },
      { name: "Los Angeles Chargers", code: "LAC", jj: 17, yt: 1800, yp: 3950, ppg: 20.4, pag: 23.4 },
      { name: "Los Angeles Rams", code: "LAR", jj: 17, yt: 2050, yp: 4100, ppg: 23.8, pag: 22.2 },
      { name: "Miami Dolphins", code: "MIA", jj: 17, yt: 2310, yp: 4500, ppg: 29.2, pag: 23.0 },
      { name: "Minnesota Vikings", code: "MIN", jj: 17, yt: 1550, yp: 4300, ppg: 20.2, pag: 21.3 },
      { name: "New England Patriots", code: "NE", jj: 17, yt: 1800, yp: 3100, ppg: 13.9, pag: 21.5 },
      { name: "New Orleans Saints", code: "NO", jj: 17, yt: 1740, yp: 3900, ppg: 23.6, pag: 19.2 },
      { name: "New York Giants", code: "NYG", jj: 17, yt: 1870, yp: 3000, ppg: 15.6, pag: 23.9 },
      { name: "New York Jets", code: "NYJ", jj: 17, yt: 1650, yp: 3200, ppg: 15.8, pag: 20.9 },
      { name: "Philadelphia Eagles", code: "PHI", jj: 17, yt: 2200, yp: 3800, ppg: 25.5, pag: 22.2 },
      { name: "Pittsburgh Steelers", code: "PIT", jj: 17, yt: 2000, yp: 3180, ppg: 17.9, pag: 19.1 },
      { name: "San Francisco 49ers", code: "SF", jj: 17, yt: 2390, yp: 4400, ppg: 28.9, pag: 17.5 },
      { name: "Seattle Seahawks", code: "SEA", jj: 17, yt: 1540, yp: 3900, ppg: 21.4, pag: 23.6 },
      { name: "Tampa Bay Buccaneers", code: "TB", jj: 17, yt: 1500, yp: 3850, ppg: 20.5, pag: 19.1 },
      { name: "Tennessee Titans", code: "TEN", jj: 17, yt: 1850, yp: 3200, ppg: 17.9, pag: 21.6 },
      { name: "Washington Commanders", code: "WAS", jj: 17, yt: 1800, yp: 3750, ppg: 19.4, pag: 30.5 }
    ];

    function renderTable(teams) {
      const tbody = document.getElementById('teamsBody');
      tbody.innerHTML = '';
      teams.forEach(t => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-700/30 transition">
            <td class="p-3 font-semibold">${t.name} <span class="text-xs text-gray-500">(${t.code})</span></td>
            <td class="p-3 text-center text-gray-300">${t.jj}</td>
            <td class="p-3 text-center text-gray-300">${t.yt}</td>
            <td class="p-3 text-center text-gray-300">${t.yp}</td>
            <td class="p-3 text-center font-bold text-green-400">${t.ppg}</td>
            <td class="p-3 text-center font-bold text-red-400">${t.pag}</td>
          </tr>
        `;
      });
    }

    function filterTeams() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = nflTeams.filter(t => t.name.toLowerCase().includes(q) || t.code.toLowerCase().includes(q));
      renderTable(filtered);
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      renderTable(nflTeams);
    });
  </script>
</body>
</html>
