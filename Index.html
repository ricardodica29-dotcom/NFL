  <style>
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    .card-blur { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="gradient-bg text-gray-100 min-h-screen pb-10">

    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-blue-600 rounded-lg"><i data-lucide="trophy" class="w-6 h-6 text-white"></i></div>
        <div>
          <h1 class="font-bold text-lg leading-none">NFL Betting Analytics 2026</h1>
          <p class="text-xs text-gray-400 mt-1">Muestreo: 2 Partidos (Semanas 1 y 2)</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 mt-6">
    <div class="bg-slate-800/60 p-4 rounded-xl border border-gray-700/50 mb-6">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
        <h2 class="font-bold text-lg flex items-center gap-2">
          <i data-lucide="users" class="w-5 h-5 text-blue-400"></i> 
          32 Equipos (Stats 2 Juegos + Lideres QB/RB)
        </h2>
        <input type="text" id="searchInput" onkeyup="filterTeams()" placeholder="Buscar equipo o jugador..." class="bg-slate-900 border border-gray-700 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500 w-full md:w-64">
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm" id="teamsTable">
          <thead class="bg-slate-900/80 text-gray-400 text-xs uppercase">
            <tr>
              <th class="p-3">Equipo</th>
              <th class="p-3 text-center">JJ</th>
              <th class="p-3">QB Principal (Yardas / TD-INT)</th>
              <th class="p-3">RB Principal (Yardas / TD)</th>
              <th class="p-3 text-center">PPG</th>
              <th class="p-3 text-center">PAG</th>
            </tr>
          </thead>
          <tbody id="teamsBody" class="divide-y divide-gray-700/50">
          </tbody>
        </table>
      </div>
    </div>
  </main>

    function renderTable(teams) {
      const tbody = document.getElementById('teamsBody');
      tbody.innerHTML = '';
      teams.forEach(t => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-700/30 transition">
            <td class="p-3 font-semibold">${t.name} <span class="text-xs text-gray-500">(${t.code})</span></td>
            <td class="p-3 text-center text-gray-300 font-bold">${t.jj}</td>
            <td class="p-3 text-blue-300 text-xs font-mono">${t.qb}</td>
            <td class="p-3 text-emerald-300 text-xs font-mono">${t.rb}</td>
            <td class="p-3 text-center font-bold text-green-400">${t.ppg}</td>
            <td class="p-3 text-center font-bold text-red-400">${t.pag}</td>
          </tr>
        `;
      });
    }

    function filterTeams() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = nfl2026Data.filter(t => 
        t.name.toLowerCase().includes(q) || 
        t.code.toLowerCase().includes(q) ||
        t.qb.toLowerCase().includes(q) ||
        t.rb.toLowerCase().includes(q)
      );
      renderTable(filtered);
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      renderTable(nfl2026Data);
    });
  </script>
</body>
</html>
